name: rustdesk
summary: RustDesk
description: Open-source remote desktop, an alternative to TeamViewer
grade: stable

apps:

  hbbs:
    user: rustdesk
    command: bin/service.hbbs.sh
    daemon: simple
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s

  hbbr:
    user: rustdesk
    command: bin/service.hbbr.sh
    daemon: simple
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s

  backend:
    user: rustdesk
    command: bin/service.backend.sh
    daemon: simple
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s

  nginx:
    user: rustdesk
    command: bin/service.nginx.sh
    daemon: simple
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s

  cli:
    command: bin/cli

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start
